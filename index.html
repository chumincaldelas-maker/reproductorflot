<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Flotante - Video Vivo</title>
    <meta name="description" content="Reproductor de video flotante que se superpone sobre otras aplicaciones">
    <meta name="keywords" content="reproductor, video, flotante, overlay, vivo">
    <meta name="author" content="Reproductor Flotante">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tu-usuario.github.io/reproductor-flotante/">
    <meta property="og:title" content="Reproductor Flotante - Video Vivo">
    <meta property="og:description" content="Reproductor de video flotante que se superpone sobre otras aplicaciones">
    <meta property="og:image" content="https://tu-usuario.github.io/reproductor-flotante/assets/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://tu-usuario.github.io/reproductor-flotante/">
    <meta property="twitter:title" content="Reproductor Flotante - Video Vivo">
    <meta property="twitter:description" content="Reproductor de video flotante que se superpone sobre otras aplicaciones">
    <meta property="twitter:image" content="https://tu-usuario.github.io/reproductor-flotante/assets/og-image.png">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Reproductor Flotante">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="floating-player" class="floating-player">
        <div class="player-header">
            <div class="player-title">🎬 Video Vivo - Reproductor Flotante</div>
            <div class="player-controls">
                <button id="minimize-btn" class="control-btn">−</button>
                <button id="close-btn" class="control-btn">×</button>
            </div>
        </div>
        
        <div class="player-content">
            <video id="video-player" class="video-element" controls>
                <source src="media/vivo.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
            
            <div class="custom-controls">
                <button id="play-pause-btn" class="control-btn">▶</button>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div id="progress" class="progress"></div>
                    </div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span> / <span id="duration">0:00</span>
                </div>
                <button id="fullscreen-btn" class="control-btn">⛶</button>
                <button id="settings-btn" class="control-btn">⚙</button>
            </div>
        </div>
        
        <div class="resize-handles">
            <div class="resize-handle resize-nw"></div>
            <div class="resize-handle resize-ne"></div>
            <div class="resize-handle resize-sw"></div>
            <div class="resize-handle resize-se"></div>
        </div>
    </div>
    
    <div id="settings-panel" class="settings-panel">
        <h3>Configuración</h3>
        <div class="setting-item">
            <label for="video-url">URL del Video:</label>
            <input type="text" id="video-url" placeholder="Ingresa la URL del video">
            <button id="load-video-btn">Cargar Video</button>
        </div>
        <div class="setting-item">
            <label for="opacity-slider">Opacidad:</label>
            <input type="range" id="opacity-slider" min="0.1" max="1" step="0.1" value="0.9">
            <span id="opacity-value">90%</span>
        </div>
        <div class="setting-item">
            <label for="always-on-top">Siempre encima:</label>
            <input type="checkbox" id="always-on-top" checked>
        </div>
        <div class="setting-item">
            <label for="auto-play">Reproducción automática:</label>
            <input type="checkbox" id="auto-play" checked>
        </div>
        <div class="setting-item">
            <label for="mobile-mode">Modo móvil:</label>
            <input type="checkbox" id="mobile-mode">
        </div>
    </div>
    
    <!-- Instrucciones para móviles -->
    <div id="mobile-instructions" class="mobile-instructions">
        <div class="mobile-content">
            <h3>📱 Instrucciones para Móviles</h3>
            <p>Para una mejor experiencia en dispositivos móviles:</p>
            <ol>
                <li>Agrega esta página a tu pantalla de inicio</li>
                <li>Usa el modo de pantalla completa</li>
                <li>Activa el modo móvil en configuración</li>
            </ol>
            <button id="close-mobile-instructions" class="btn-primary">Entendido</button>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
