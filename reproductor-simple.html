<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Flotante - El Chavo del 8</title>
    <style>
        /* Reset y configuración base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            overflow: hidden;
            user-select: none;
        }

        /* Reproductor flotante principal */
        .floating-player {
            position: fixed;
            top: 50px;
            left: 50px;
            width: 500px;
            height: 350px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            resize: both;
            overflow: hidden;
        }

        .floating-player:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        /* Header del reproductor */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(40, 40, 40, 0.9);
            border-bottom: 1px solid #555;
            cursor: move;
            border-radius: 8px 8px 0 0;
        }

        .player-title {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        .player-controls {
            display: flex;
            gap: 5px;
        }

        .control-btn {
            background: rgba(60, 60, 60, 0.8);
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(80, 80, 80, 0.9);
        }

        #close-btn:hover {
            background: #ff4444;
        }

        /* Contenido del reproductor */
        .player-content {
            position: relative;
            height: calc(100% - 40px);
            display: flex;
            flex-direction: column;
        }

        .video-element {
            width: 100%;
            height: calc(100% - 50px);
            background: #000;
            border: none;
            outline: none;
        }

        /* Controles personalizados */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .floating-player:hover .custom-controls {
            opacity: 1;
        }

        .progress-container {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            position: relative;
        }

        .progress {
            height: 100%;
            background: #4CAF50;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .time-display {
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
        }

        /* Handles de redimensionamiento */
        .resize-handles {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .resize-handle {
            position: absolute;
            background: transparent;
            pointer-events: all;
        }

        .resize-nw {
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            cursor: nw-resize;
        }

        .resize-ne {
            top: 0;
            right: 0;
            width: 10px;
            height: 10px;
            cursor: ne-resize;
        }

        .resize-sw {
            bottom: 0;
            left: 0;
            width: 10px;
            height: 10px;
            cursor: sw-resize;
        }

        .resize-se {
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            cursor: se-resize;
        }

        /* Estados especiales */
        .floating-player.minimized {
            height: 40px;
            width: 200px;
        }

        .floating-player.minimized .player-content {
            display: none;
        }

        .floating-player.fullscreen {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0;
            z-index: 10001;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .floating-player {
            animation: fadeIn 0.3s ease;
        }

        /* Mensaje de estado */
        .status-message {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #4CAF50;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="floating-player" class="floating-player">
        <div class="player-header">
            <div class="player-title">🎬 Video Vivo - Reproductor Flotante</div>
            <div class="player-controls">
                <button id="minimize-btn" class="control-btn">−</button>
                <button id="close-btn" class="control-btn">×</button>
            </div>
        </div>
        
        <div class="player-content">
            <video id="video-player" class="video-element" controls>
                <source src="media/vivo.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
            
            <div class="custom-controls">
                <button id="play-pause-btn" class="control-btn">▶</button>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div id="progress" class="progress"></div>
                    </div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span> / <span id="duration">0:00</span>
                </div>
                <button id="fullscreen-btn" class="control-btn">⛶</button>
            </div>
        </div>
        
        <div class="resize-handles">
            <div class="resize-handle resize-nw"></div>
            <div class="resize-handle resize-ne"></div>
            <div class="resize-handle resize-sw"></div>
            <div class="resize-handle resize-se"></div>
        </div>
    </div>
    
    <div class="status-message" id="status-message">Cargando video...</div>

    <script>
        class SimpleFloatingPlayer {
            constructor() {
                this.player = document.getElementById('floating-player');
                this.video = document.getElementById('video-player');
                this.statusMessage = document.getElementById('status-message');
                this.isDragging = false;
                this.isResizing = false;
                this.dragOffset = { x: 0, y: 0 };
                this.resizeData = { handle: null, startX: 0, startY: 0, startWidth: 0, startHeight: 0 };
                this.isMinimized = false;
                this.isFullscreen = false;
                
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.setupDragAndDrop();
                this.setupResizeHandles();
                this.setupVideoControls();
                this.updateStatus('Video cargado: vivo.mp4');
            }
            
            setupEventListeners() {
                // Botones de control del header
                document.getElementById('minimize-btn').addEventListener('click', () => this.toggleMinimize());
                document.getElementById('close-btn').addEventListener('click', () => this.closePlayer());
                
                // Botones de control del video
                document.getElementById('play-pause-btn').addEventListener('click', () => this.togglePlayPause());
                document.getElementById('fullscreen-btn').addEventListener('click', () => this.toggleFullscreen());
                
                // Eventos del video
                this.video.addEventListener('loadedmetadata', () => this.updateDuration());
                this.video.addEventListener('timeupdate', () => this.updateProgress());
                this.video.addEventListener('play', () => this.updatePlayButton());
                this.video.addEventListener('pause', () => this.updatePlayButton());
                this.video.addEventListener('ended', () => this.updatePlayButton());
                this.video.addEventListener('loadstart', () => this.updateStatus('Cargando video...'));
                this.video.addEventListener('canplay', () => this.updateStatus('Video listo para reproducir'));
                this.video.addEventListener('error', () => this.updateStatus('Error al cargar video', 'error'));
                
                // Barra de progreso
                document.querySelector('.progress-container').addEventListener('click', (e) => this.seekTo(e));
                
                // Teclas de acceso rápido
                document.addEventListener('keydown', (e) => this.handleKeyboard(e));
                
                // Prevenir que el reproductor se cierre accidentalmente
                this.player.addEventListener('click', (e) => e.stopPropagation());
            }
            
            setupDragAndDrop() {
                const header = document.querySelector('.player-header');
                
                header.addEventListener('mousedown', (e) => {
                    if (e.target.classList.contains('control-btn')) return;
                    
                    this.isDragging = true;
                    this.dragOffset.x = e.clientX - this.player.offsetLeft;
                    this.dragOffset.y = e.clientY - this.player.offsetTop;
                    
                    document.addEventListener('mousemove', this.handleDrag.bind(this));
                    document.addEventListener('mouseup', this.stopDrag.bind(this));
                    
                    e.preventDefault();
                });
            }
            
            handleDrag(e) {
                if (!this.isDragging) return;
                
                const newX = e.clientX - this.dragOffset.x;
                const newY = e.clientY - this.dragOffset.y;
                
                // Mantener el reproductor dentro de los límites de la pantalla
                const maxX = window.innerWidth - this.player.offsetWidth;
                const maxY = window.innerHeight - this.player.offsetHeight;
                
                this.player.style.left = Math.max(0, Math.min(newX, maxX)) + 'px';
                this.player.style.top = Math.max(0, Math.min(newY, maxY)) + 'px';
            }
            
            stopDrag() {
                this.isDragging = false;
                document.removeEventListener('mousemove', this.handleDrag.bind(this));
                document.removeEventListener('mouseup', this.stopDrag.bind(this));
            }
            
            setupResizeHandles() {
                const handles = document.querySelectorAll('.resize-handle');
                
                handles.forEach(handle => {
                    handle.addEventListener('mousedown', (e) => {
                        this.isResizing = true;
                        this.resizeData.handle = handle.className.split(' ')[1];
                        this.resizeData.startX = e.clientX;
                        this.resizeData.startY = e.clientY;
                        this.resizeData.startWidth = this.player.offsetWidth;
                        this.resizeData.startHeight = this.player.offsetHeight;
                        
                        document.addEventListener('mousemove', this.handleResize.bind(this));
                        document.addEventListener('mouseup', this.stopResize.bind(this));
                        
                        e.preventDefault();
                    });
                });
            }
            
            handleResize(e) {
                if (!this.isResizing) return;
                
                const deltaX = e.clientX - this.resizeData.startX;
                const deltaY = e.clientY - this.resizeData.startY;
                
                let newWidth = this.resizeData.startWidth;
                let newHeight = this.resizeData.startHeight;
                
                switch (this.resizeData.handle) {
                    case 'resize-se':
                        newWidth += deltaX;
                        newHeight += deltaY;
                        break;
                    case 'resize-sw':
                        newWidth -= deltaX;
                        newHeight += deltaY;
                        this.player.style.left = (this.player.offsetLeft + deltaX) + 'px';
                        break;
                    case 'resize-ne':
                        newWidth += deltaX;
                        newHeight -= deltaY;
                        this.player.style.top = (this.player.offsetTop + deltaY) + 'px';
                        break;
                    case 'resize-nw':
                        newWidth -= deltaX;
                        newHeight -= deltaY;
                        this.player.style.left = (this.player.offsetLeft + deltaX) + 'px';
                        this.player.style.top = (this.player.offsetTop + deltaY) + 'px';
                        break;
                }
                
                // Tamaños mínimos y máximos
                newWidth = Math.max(200, Math.min(newWidth, window.innerWidth));
                newHeight = Math.max(150, Math.min(newHeight, window.innerHeight));
                
                this.player.style.width = newWidth + 'px';
                this.player.style.height = newHeight + 'px';
            }
            
            stopResize() {
                this.isResizing = false;
                document.removeEventListener('mousemove', this.handleResize.bind(this));
                document.removeEventListener('mouseup', this.stopResize.bind(this));
            }
            
            setupVideoControls() {
                // Los controles del video se manejan a través de los event listeners ya configurados
            }
            
            updateStatus(message, type = 'info') {
                this.statusMessage.textContent = message;
                this.statusMessage.style.color = type === 'error' ? '#ff4444' : '#4CAF50';
                
                // Auto-ocultar después de 3 segundos
                setTimeout(() => {
                    this.statusMessage.style.opacity = '0';
                }, 3000);
            }
            
            toggleMinimize() {
                this.isMinimized = !this.isMinimized;
                this.player.classList.toggle('minimized', this.isMinimized);
                
                const btn = document.getElementById('minimize-btn');
                btn.textContent = this.isMinimized ? '□' : '−';
            }
            
            closePlayer() {
                if (confirm('¿Estás seguro de que quieres cerrar el reproductor?')) {
                    this.player.style.display = 'none';
                }
            }
            
            togglePlayPause() {
                if (this.video.paused) {
                    this.video.play();
                } else {
                    this.video.pause();
                }
            }
            
            toggleFullscreen() {
                this.isFullscreen = !this.isFullscreen;
                this.player.classList.toggle('fullscreen', this.isFullscreen);
                
                if (this.isFullscreen) {
                    this.player.style.top = '0';
                    this.player.style.left = '0';
                    this.player.style.width = '100vw';
                    this.player.style.height = '100vh';
                } else {
                    this.player.style.top = '50px';
                    this.player.style.left = '50px';
                    this.player.style.width = '500px';
                    this.player.style.height = '350px';
                }
            }
            
            updateDuration() {
                const duration = this.video.duration;
                document.getElementById('duration').textContent = this.formatTime(duration);
            }
            
            updateProgress() {
                const progress = (this.video.currentTime / this.video.duration) * 100;
                document.getElementById('progress').style.width = progress + '%';
                document.getElementById('current-time').textContent = this.formatTime(this.video.currentTime);
            }
            
            updatePlayButton() {
                const btn = document.getElementById('play-pause-btn');
                btn.textContent = this.video.paused ? '▶' : '⏸';
            }
            
            seekTo(e) {
                const rect = e.currentTarget.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                this.video.currentTime = pos * this.video.duration;
            }
            
            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }
            
            handleKeyboard(e) {
                switch (e.key) {
                    case ' ':
                        e.preventDefault();
                        this.togglePlayPause();
                        break;
                    case 'f':
                    case 'F':
                        this.toggleFullscreen();
                        break;
                    case 'm':
                    case 'M':
                        this.toggleMinimize();
                        break;
                    case 'Escape':
                        if (this.isFullscreen) {
                            this.toggleFullscreen();
                        }
                        break;
                }
            }
        }

        // Inicializar el reproductor cuando se carga la página
        document.addEventListener('DOMContentLoaded', () => {
            new SimpleFloatingPlayer();
        });

        // Prevenir el menú contextual por defecto
        document.addEventListener('contextmenu', (e) => {
            if (e.target.closest('.floating-player')) {
                e.preventDefault();
            }
        });

        // Prevenir la selección de texto
        document.addEventListener('selectstart', (e) => {
            if (e.target.closest('.floating-player')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
